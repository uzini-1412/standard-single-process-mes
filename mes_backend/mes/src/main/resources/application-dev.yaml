server:
  port: 7081

spring:
  datasource:
    url: jdbc:mysql://localhost:7085/mes_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 600000
      keepalive-time: 120000
      validation-timeout: 3000
      connection-test-query: SELECT 1
      leak-detection-threshold: 60000

  data:
    redis:
      host: localhost
      port: 7086
      password: ${REDIS_PASSWORD:changeme}

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

  jackson:
    time-zone: Asia/Seoul

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    com.mes: DEBUG

app:
  admin:
    default-id: ${ADMIN_DEFAULT_ID:mesadmin}
    default-password: ${ADMIN_DEFAULT_PASSWORD:ChangeMe!2026}
  upload:
    dir: ${APP_UPLOAD_DIR:C:/mes_upload}
  cors:
    allowed-origin-patterns:
      - "http://localhost:*"
      - "https://localhost:*"
      - "http://127.0.0.1:*"
      - "https://127.0.0.1:*"
