# 모든 프로파일이 공유하는 기본 설정.
#
# 프로파일별 파일(application-dev.yaml / application-prod.yaml)이 같은 키를 덮어쓴다.
# prod 파일은 시크릿이 들어가므로 저장소에 없다(.gitignore). 즉 컨테이너는
# "이 파일 + 환경변수"만으로 뜬다 — prod 에 꼭 필요한 값은 여기에 두어야 한다.
# (docker-compose.yml 이 SPRING_DATASOURCE_*, SPRING_DATA_REDIS_*, JWT_SECRET,
#  APP_UPLOAD_DIR 를 넘긴다. DB/Redis 접속 정보는 그래서 여기에 없다.)

spring:
  profiles:
    # ./gradlew bootRun 처럼 프로파일을 안 주고 띄우면 dev 로 동작한다.
    # 컨테이너는 Dockerfile 의 -Dspring.profiles.active=prod 가 이 값을 이긴다.
    default: dev

  servlet:
    multipart:
      enabled: true
      # Spring 기본값이 1MB 라서, 이 설정이 없으면 설비·품목 사진과 도면 PDF 업로드가
      # 413(MaxUploadSizeExceededException)으로 실패한다. dev 프로파일에만 있던 값을
      # 공통으로 올려 prod 에서도 동일하게 적용되게 한다.
      max-file-size: 50MB
      max-request-size: 50MB

  jackson:
    time-zone: Asia/Seoul
    # 날짜는 [2026,9,3] 배열이 아니라 "2026-09-03" 문자열로 나가야 한다(프론트 4개가 전부 문자열 전제).
    # 이건 Jackson 3 의 기본 동작이라 별도 설정을 두지 않았다. 계획서 초안의
    # `serialization.write-dates-as-timestamps` 는 Boot 4(Jackson 3)에서 이 플래그가
    # SerializationFeature → DateTimeFeature 로 옮겨져 **기동 자체가 실패한다.**
    # `datetime` / `date-time` 하위로 옮겨 봐도 Boot 4.0.2 가 인식하지 못하고 조용히 무시한다.

  jpa:
    hibernate:
      # 스키마의 소유자는 mes_db/schema.sql 이다. 애플리케이션이 테이블을 만들지 않는다.
      ddl-auto: none

app:
  upload:
    # ImageUploadController 가 기본값 없이 주입받는 값이라, 비어 있으면 기동 자체가 실패한다.
    # 컨테이너는 APP_UPLOAD_DIR=/app/uploads 를 넘긴다(volume 마운트 지점).
    dir: ${APP_UPLOAD_DIR:/app/uploads}
